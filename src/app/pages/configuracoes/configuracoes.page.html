<!-- settings.page.html -->

<ion-header class="ion-no-border">
  <ion-toolbar color="dark">

    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>
      <div class="header-title">

        <div class="header-icon">
          <ion-icon name="settings-outline"></ion-icon>
        </div>

        <span>Configurações</span>

      </div>
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content color="dark">

  <!-- FOTO PERFIL -->
  <ion-card class="profile-card">

    <div class="profile-container">

      <div class="avatar-wrapper">

        <ion-avatar class="profile-avatar">

          <div class="avatar-fallback">
            JP
          </div>

        </ion-avatar>

        <ion-button
          fill="solid"
          shape="round"
          class="camera-button"
        >
          <ion-icon name="camera-outline"></ion-icon>
        </ion-button>

      </div>

      <h2>João Pedro</h2>

      <p>joao@email.com</p>

    </div>

  </ion-card>

  <!-- CONTA -->
  <div class="section">

    <h3>
      <ion-icon
        name="person-outline"
        class="blue"
      ></ion-icon>

      Conta
    </h3>

    <ion-card class="settings-card">

      <button class="settings-item">

        <div class="left">

          <ion-icon name="person-outline"></ion-icon>

          <span>Editar Perfil</span>

        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="arrow"
        ></ion-icon>

      </button>



      <button class="settings-item">

        <div class="left">

          <ion-icon name="mail-outline"></ion-icon>

          <span>Alterar Email</span>

        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="arrow"
        ></ion-icon>

      </button>



      <button class="settings-item">

        <div class="left">

          <ion-icon name="lock-closed-outline"></ion-icon>

          <span>Alterar Senha</span>

        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="arrow"
        ></ion-icon>

      </button>

    </ion-card>

  </div>

  <!-- NOTIFICAÇÕES -->
  <div class="section">

    <h3>
      <ion-icon
        name="notifications-outline"
        class="purple"
      ></ion-icon>

      Notificações
    </h3>

    <ion-card class="settings-card">

      <div class="switch-item">

        <div class="left">

          <ion-icon name="mail-outline"></ion-icon>

          <span>Notificações por Email</span>

        </div>

        <ion-toggle
          [(ngModel)]="emailNotifications"
        ></ion-toggle>

      </div>



      <div class="switch-item">

        <div class="left">

          <ion-icon name="notifications-outline"></ion-icon>

          <span>Notificações Push</span>

        </div>

        <ion-toggle
          [(ngModel)]="pushNotifications"
        ></ion-toggle>

      </div>



      <div class="switch-item">

        <div class="left">

          <ion-icon name="chatbubble-outline"></ion-icon>

          <span>Feedback Recebido</span>

        </div>

        <ion-toggle
          [(ngModel)]="feedbackNotifications"
        ></ion-toggle>

      </div>



      <div class="switch-item">

        <div class="left">

          <ion-icon name="trending-up-outline"></ion-icon>

          <span>Atualizações de Progresso</span>

        </div>

        <ion-toggle
          [(ngModel)]="progressNotifications"
        ></ion-toggle>

      </div>

    </ion-card>

  </div>

  <!-- PRIVACIDADE -->
  <div class="section">

    <h3>
      <ion-icon
        name="shield-checkmark-outline"
        class="green"
      ></ion-icon>

      Privacidade e Segurança
    </h3>

    <ion-card class="settings-card">

      <button class="settings-item">

        <div class="left">

          <ion-icon name="shield-outline"></ion-icon>

          <span>Privacidade da Conta</span>

        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="arrow"
        ></ion-icon>

      </button>



      <button class="settings-item">

        <div class="left">

          <ion-icon name="lock-closed-outline"></ion-icon>

          <span>Segurança</span>

        </div>

        <ion-icon
          name="chevron-forward-outline"
          class="arrow"
        ></ion-icon>

      </button>

    </ion-card>

  </div>

  <!-- APARÊNCIA -->
  <div class="section">

    <h3>
      <ion-icon
        name="moon-outline"
        class="yellow"
      ></ion-icon>

      Aparência
    </h3>

    <ion-card class="settings-card">

      <div class="switch-item">

        <div class="left">

          <ion-icon name="moon-outline"></ion-icon>

          <span>Tema Escuro</span>

        </div>

        <ion-toggle
          [(ngModel)]="darkMode"
        ></ion-toggle>

      </div>

    </ion-card>

  </div>

  <!-- BOTÃO SAIR -->
  <div class="logout-container">

    <ion-button
      expand="block"
      color="danger"
      shape="round"
      class="logout-button"
    >

      <ion-icon
        name="log-out-outline"
        slot="start"
      ></ion-icon>

      Sair da Conta

    </ion-button>

  </div>

  <p class="version">
    First Step Dev • Versão 1.0.0
  </p>

</ion-content>
