<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Editar Tarefa
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="stacked">
      Título
    </ion-label>

    <ion-input
      [(ngModel)]="titulo">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">
      Descrição
    </ion-label>

    <ion-textarea
      [(ngModel)]="descricao">
    </ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">
      Categoria
    </ion-label>

    <ion-input
      [(ngModel)]="categoria">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label>
      Dificuldade
    </ion-label>

    <ion-select
      [(ngModel)]="nivelDificuldade">

      <ion-select-option
        value="Facil">

        Fácil

      </ion-select-option>

      <ion-select-option
        value="Medio">

        Médio

      </ion-select-option>

      <ion-select-option
        value="Dificil">

        Difícil

      </ion-select-option>

    </ion-select>
  </ion-item>

  <ion-button
    expand="block"
    color="success"
    class="ion-margin-top"
    (click)="salvar()">

    Salvar Alterações

  </ion-button>

</ion-content>
