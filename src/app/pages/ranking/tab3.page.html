<ion-content [fullscreen]="true">
 
<ion-header>

  <ion-toolbar>

    <ion-title>
      Ranking
    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content>

  <ion-card
    *ngFor="
      let usuario of ranking;
      let i = index
    ">

    <ion-card-content>

      <h2>

        #{{ i + 1 }}

        {{ usuario.nome }}

      </h2>

      <p>

        {{ usuario.pontuacao }}
        pontos

      </p>

    </ion-card-content>

  </ion-card>

</ion-content>
